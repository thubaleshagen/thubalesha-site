<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THUBALESHA Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:#0d0d0d;
color:white;
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#111;
padding:25px;
position:fixed;
height:100%;
border-right:1px solid rgba(255,215,0,0.2);
}

.logo{
font-size:28px;
font-weight:bold;
color:gold;
margin-bottom:40px;
text-align:center;
}

.menu a{
display:block;
padding:14px;
margin-bottom:10px;
background:#1a1a1a;
border-radius:10px;
color:white;
text-decoration:none;
transition:0.3s;
}

.menu a:hover{
background:gold;
color:black;
}

/* MAIN */

.main{
margin-left:260px;
padding:25px;
width:100%;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.topbar h1{
color:gold;
}

.admin-box{
background:#1a1a1a;
padding:10px 15px;
border-radius:10px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#161616;
padding:25px;
border-radius:16px;
box-shadow:0 0 20px rgba(255,215,0,0.08);
}

.card h3{
color:#aaa;
margin-bottom:10px;
}

.card .number{
font-size:36px;
font-weight:bold;
color:gold;
}

/* TABLES */

.table-box{
background:#161616;
padding:20px;
border-radius:16px;
margin-top:20px;
overflow:auto;
}

.table-box h2{
margin-bottom:20px;
color:gold;
}

table{
width:100%;
border-collapse:collapse;
}

table th{
background:#222;
padding:14px;
text-align:left;
}

table td{
padding:14px;
border-bottom:1px solid #222;
}

.status{
padding:6px 10px;
border-radius:6px;
font-size:13px;
font-weight:bold;
display:inline-block;
}

.pending{
background:#ff9800;
color:black;
}

.success{
background:#00c853;
color:white;
}

.failed{
background:#ff1744;
color:white;
}

/* BUTTONS */

.btn{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.gold-btn{
background:gold;
color:black;
}

.red-btn{
background:#ff4444;
color:white;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
}

body{
display:block;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
THUBALESHA
</div>

<div class="menu">

<a href="#">📊 Dashboard</a>

<a href="#">🛒 Orders</a>

<a href="#">👥 Customers</a>

<a href="#">💰 Payments</a>

<a href="#">🎁 Referrals</a>

<a href="#">📦 Products</a>

<a href="#">⚙ Settings</a>

</div>

<button class="btn red-btn" onclick="logout()">
Logout
</button>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<h1>Main Dashboard</h1>

<div class="admin-box">
Admin Panel
</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="card">

<h3>Total Orders</h3>

<div class="number" id="totalOrders">
0
</div>

</div>

<div class="card">

<h3>Total Customers</h3>

<div class="number" id="totalCustomers">
0
</div>

</div>

<div class="card">

<h3>Total Revenue</h3>

<div class="number">
R<span id="totalRevenue">0</span>
</div>

</div>

<div class="card">

<h3>Total Referrals</h3>

<div class="number" id="totalReferrals">
0
</div>

</div>

</div>

<!-- ORDERS -->

<div class="table-box">

<h2>Recent Orders</h2>

<table>

<thead>

<tr>

<th>Customer</th>

<th>Product</th>

<th>Amount</th>

<th>Status</th>

<th>Date</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

</div>

<!-- CUSTOMERS -->

<div class="table-box">

<h2>Customers</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Referral</th>

</tr>

</thead>

<tbody id="customersTable">

</tbody>

</table>

</div>

</div>

<script>

/* STORAGE */

const USERS_KEY="thubalesha_users";

const ORDERS_KEY="thubalesha_orders";

/* LOAD USERS */

let users=
JSON.parse(
localStorage.getItem(USERS_KEY)||"[]"
);

/* LOAD ORDERS */

let orders=
JSON.parse(
localStorage.getItem(ORDERS_KEY)||"[]"
);

/* TOTALS */

document.getElementById("totalCustomers")
.innerText=users.length;

document.getElementById("totalOrders")
.innerText=orders.length;

/* REVENUE */

let revenue=0;

orders.forEach(order=>{

revenue+=Number(order.total||0);

});

document.getElementById("totalRevenue")
.innerText=revenue;

/* REFERRALS */

let referrals=0;

users.forEach(user=>{

referrals+=user.friends ?
user.friends.length : 0;

});

document.getElementById("totalReferrals")
.innerText=referrals;

/* ORDERS TABLE */

let ordersHTML="";

if(orders.length===0){

ordersHTML=`

<tr>

<td colspan="5">
No orders found
</td>

</tr>

`;

}else{

orders.reverse().forEach(order=>{

ordersHTML+=`

<tr>

<td>${order.name || "Customer"}</td>

<td>${order.product || "Product"}</td>

<td>R${order.total || 0}</td>

<td>

<span class="status pending">

Pending

</span>

</td>

<td>${order.date || "-"}</td>

</tr>

`;

});

}

document.getElementById("ordersTable")
.innerHTML=ordersHTML;

/* CUSTOMERS TABLE */

let customersHTML="";

if(users.length===0){

customersHTML=`

<tr>

<td colspan="4">
No customers found
</td>

</tr>

`;

}else{

users.forEach(user=>{

customersHTML+=`

<tr>

<td>${user.name}</td>

<td>${user.email}</td>

<td>${user.contact}</td>

<td>${user.referral}</td>

</tr>

`;

});

}

document.getElementById("customersTable")
.innerHTML=customersHTML;

/* LOGOUT */

function logout(){

alert("Logged Out");

location.reload();

}

</script>

</body>
</html>
