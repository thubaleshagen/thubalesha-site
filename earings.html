<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THUBALESHA Earrings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f8f4ef;
color:#222;
}

header{
background:#000;
color:#fff;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

header h1{
font-size:28px;
}

header p{
color:#d4af37;
margin-top:5px;
}

header button{
margin-top:10px;
padding:10px 18px;
background:#d4af37;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

#searchBar{
width:90%;
max-width:420px;
display:block;
margin:20px auto;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
}

#giftBox{
text-align:center;
padding:15px;
}

.gift-track{
width:90%;
height:20px;
background:#ddd;
margin:10px auto;
border-radius:20px;
overflow:hidden;
}

#giftFill{
height:100%;
width:0%;
background:linear-gradient(90deg,#d4af37,#ffd700);
transition:0.4s;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.info{
padding:15px;
text-align:center;
}

.price{
color:#d4af37;
font-size:22px;
font-weight:bold;
margin:10px 0;
}

button{
background:#000;
color:#fff;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#d4af37;
color:#000;
}

#cartPanel{
position:fixed;
top:0;
right:0;
width:100%;
max-width:380px;
height:100%;
background:#fff;
padding:20px;
overflow:auto;
display:none;
z-index:9999;
box-shadow:-5px 0 15px rgba(0,0,0,0.2);
}

.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

.qty button{
padding:3px 8px;
}

.pay-btn{
display:block;
width:100%;
padding:12px;
margin-top:10px;
background:#000;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
text-align:center;
text-decoration:none;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

#checkout{
display:none;
margin-top:15px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:#fff;
padding:14px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

footer{
background:#000;
color:#fff;
text-align:center;
padding:15px;
margin-top:20px;
}

</style>
</head>
<body>

<header>

<h1>THUBALESHA Earrings</h1>

<p>Luxury Earrings Collection</p>

<button onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</header>

<input
type="text"
id="searchBar"
placeholder="Search earrings..."
onkeyup="searchProducts()"
>

<div id="giftBox">

<h4>🎁 Free Gift At R1500</h4>

<div class="gift-track">
<div id="giftFill"></div>
</div>

<p id="giftText">
Add items to unlock
</p>

</div>

<div class="products" id="productList"></div>

<!-- CART PANEL -->

<div id="cartPanel">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<h3>Total: R<span id="totalPrice">0</span></h3>

<button class="pay-btn" onclick="showCheckout()">
Checkout
</button>

<button class="pay-btn" onclick="closeCart()">
Close
</button>

<div id="checkout">

<h3>Delivery Details</h3>

<input id="name" placeholder="Full Name">

<input id="phone" placeholder="Phone Number">

<input id="address" placeholder="Delivery Address">

<input id="referral" placeholder="Referral Code Optional">

<select id="deliveryOption" onchange="changeDelivery()">
<option value="60">Local Delivery R60</option>
<option value="120">Nationwide Delivery R120</option>
</select>

<button class="pay-btn" onclick="placeOrder()">
💳 Pay With Yoco
</button>

<a
class="pay-btn"
href="https://www.paypal.com/ncp/payment/2QBAVWTMDFPFW"
target="_blank">
Pay With PayPal
</a>

<a
class="pay-btn"
id="whatsappOrder"
target="_blank">
Order Via WhatsApp
</a>

</div>

</div>

<a
href="https://wa.me/27656911520"
class="whatsapp">
Chat
</a>

<footer>

<p>THUBALESHA Luxury Accessories</p>

<p>Secure Orders • Nationwide Delivery</p>

</footer>

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

<!-- MAIN SCRIPT -->

<script>

const products = [

{name:"Golden Heart Earrings", image:"Hc50f34cfdeef441e952fd68d97c23c71Q_png.jpeg"},
{name:"Diamond Shine Earrings", image:"Untitleddesign_6.png"},
{name:"Luxury Hoop Earrings", image:"294E57FD-A794-4421-BE66-90BE32286FDD_6a581b1c-cd30-4b9e-8e51-56c48aaddde4.jpg"},
{name:"Classic Silver Earrings", image:"9-2.png"},
{name:"Royal Pearl Earrings", image:"CC421DEA-044B-49DD-A36E-2D3D15422804.png"},
{name:"Elegant Crystal Earrings", image:"88260B6F-65A6-4150-8AB5-D7266EF1D770.png"},
{name:"Luxury Drop Earrings", image:"E9094656-7A85-4F7E-A579-9D775C72DF29.png"},
{name:"Premium Fashion Earrings", image:"ChatGPTImageApr21_2026at05_57_54AM.png"},
{name:"Modern Gold Earrings", image:"ChatGPTImageApr21_2026at05_56_14AM.png"},
{name:"Sparkle Earrings", image:"ChatGPTImageApr21_2026at05_54_07AM.png"},
{name:"Elegant Luxury Earrings", image:"ChatGPTImageApr21_2026at05_52_08AM.png"}

];

let cart=[];

let deliveryFee=60;

function loadProducts(list){

const container=document.getElementById("productList");

container.innerHTML="";

list.forEach(product=>{

container.innerHTML += `

<div class="card">

<img src="${product.image}" alt="${product.name}">

<div class="info">

<h3>${product.name}</h3>

<p class="price">R550</p>

<button onclick="addToCart('${product.name}')">
Buy Now
</button>

</div>

</div>

`;

});

}

function addToCart(name){

let item=cart.find(p=>p.name===name);

if(item){

item.qty++;

}else{

cart.push({
name:name,
qty:1
});

}

updateCart();

alert("Product added to cart!");

}

function updateCart(){

const items=document.getElementById("cartItems");

items.innerHTML="";

let total=0;

cart.forEach((p,i)=>{

let price=550*p.qty;

total+=price;

items.innerHTML += `

<div class="cart-item">

<span>${p.name} x${p.qty}</span>

<div class="qty">

<button onclick="changeQty(${i},-1)">-</button>

<button onclick="changeQty(${i},1)">+</button>

</div>

</div>

`;

});

total+=deliveryFee;

document.getElementById("totalPrice").innerText=total;

document.getElementById("cartCount").innerText=cart.length;

let percent=(total/1500)*100;

if(percent>100) percent=100;

document.getElementById("giftFill").style.width=
percent+"%";

document.getElementById("giftText").innerText=

total>=1500
?
"🎉 Gift Unlocked"
:
"Spend R"+(1500-total);

let order=cart.map(p=>`${p.name} x${p.qty}`).join(", ");

document.getElementById("whatsappOrder").href=

`https://wa.me/27656911520?text=Earrings%20Order:%20${order}%20Total:R${total}`;

}

function changeQty(i,change){

cart[i].qty+=change;

if(cart[i].qty<=0){

cart.splice(i,1);

}

updateCart();

}

function searchProducts(){

const value=document.getElementById("searchBar")
.value.toLowerCase();

const filtered=products.filter(p=>

p.name.toLowerCase().includes(value)

);

loadProducts(filtered);

}

function openCart(){

document.getElementById("cartPanel")
.style.display="block";

}

function closeCart(){

document.getElementById("cartPanel")
.style.display="none";

}

function showCheckout(){

document.getElementById("checkout")
.style.display="block";

}

function changeDelivery(){

deliveryFee=parseInt(

document.getElementById("deliveryOption").value

);

updateCart();

}

async function placeOrder(){

if(cart.length===0){

alert("Cart is empty");

return;

}

const name=
document.getElementById("name").value;

const phone=
document.getElementById("phone").value;

const address=
document.getElementById("address").value;

const referral=
document.getElementById("referral").value;

if(!name || !phone || !address){

alert("Please fill all fields");

return;

}

let total=0;

cart.forEach(p=>{

total+=550*p.qty;

});

total+=deliveryFee;

const orderData={

store:"THUBALESHA Earrings",

customer:name,

phone:phone,

address:address,

referral:referral,

items:cart,

deliveryFee:deliveryFee,

total:total,

status:"pending",

createdAt:new Date().toISOString()

};

try{

await push(

ref(db,"orders"),

orderData

);

alert("Order Saved Successfully");

window.location.href=
"https://pay.yoco.com/thubalesha-general-trading";

}catch(error){

console.log(error);

alert("Error Saving Order");

}

}

loadProducts(products);

</script>

</body>
</html>
