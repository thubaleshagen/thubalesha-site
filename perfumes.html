<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thubalesha Secure Checkout</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.checkout-container{
width:100%;
max-width:500px;
background:#fff;
border-radius:25px;
padding:30px;
box-shadow:0 10px 40px rgba(0,0,0,0.35);
animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
text-align:center;
font-size:32px;
font-weight:700;
margin-bottom:20px;
}

.logo span{
color:#ff9900;
}

h2{
font-size:26px;
margin-bottom:20px;
color:#111;
}

.input-group{
margin-bottom:18px;
}

.input-group input,
.input-group textarea{
width:100%;
padding:18px;
border:none;
background:#f3f3f3;
border-radius:15px;
font-size:16px;
outline:none;
transition:0.3s;
}

.input-group input:focus,
.input-group textarea:focus{
background:#ececec;
}

textarea{
resize:none;
height:110px;
}

.summary{
background:#f8f8f8;
padding:18px;
border-radius:15px;
margin-bottom:20px;
}

.summary h3{
margin-bottom:10px;
font-size:20px;
}

.summary p{
font-size:15px;
margin-bottom:6px;
color:#444;
}

.total{
font-size:22px;
font-weight:700;
margin-top:10px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:0.3s;
margin-top:15px;
}

.pay-btn{
background:#0070ba;
color:white;
}

.pay-btn:hover{
transform:scale(1.02);
background:#005ea6;
}

.whatsapp-btn{
background:#25D366;
color:white;
}

.whatsapp-btn:hover{
transform:scale(1.02);
}

.loader{
display:none;
margin-top:18px;
text-align:center;
font-weight:600;
font-size:16px;
color:#333;
}

.success{
display:none;
background:#d4edda;
color:#155724;
padding:15px;
border-radius:12px;
margin-top:18px;
font-weight:600;
text-align:center;
}

.footer{
margin-top:25px;
text-align:center;
font-size:13px;
color:#666;
}

</style>
</head>

<body>

<div class="checkout-container">

<div class="logo">
THUBALESHA <span>STORE</span>
</div>

<h2>Delivery Details</h2>

<div class="input-group">
<input type="text" id="name" placeholder="Full Name">
</div>

<div class="input-group">
<input type="tel" id="phone" placeholder="Phone Number">
</div>

<div class="input-group">
<textarea id="address" placeholder="Delivery Address"></textarea>
</div>

<div class="summary">
<h3>Order Summary</h3>
<p>Product: Premium Item</p>
<p>Shipping: Free</p>
<div class="total">Total: R499</div>
</div>

<button class="pay-btn" onclick="payNow()">
Pay Securely
</button>

<button class="whatsapp-btn" onclick="orderWhatsapp()">
Order Via WhatsApp
</button>

<div class="loader" id="loader">
Processing your order...
</div>

<div class="success" id="success">
Order saved successfully
</div>

<div class="footer">
Powered By Firebase Secure Checkout
</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_PROJECT.firebaseapp.com",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_PROJECT.appspot.com",

messagingSenderId: "YOUR_SENDER_ID",

appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



async function saveOrder(paymentMethod){

const name = document.getElementById("name").value.trim();

const phone = document.getElementById("phone").value.trim();

const address = document.getElementById("address").value.trim();

const loader = document.getElementById("loader");

const success = document.getElementById("success");


if(!name || !phone || !address){

alert("Please fill all fields");

return null;

}


loader.style.display = "block";

success.style.display = "none";


const orderData = {

customerName:name,

customerPhone:phone,

customerAddress:address,

paymentMethod:paymentMethod,

amount:"499",

currency:"ZAR",

status:"Pending",

createdAt:serverTimestamp()

};


try{

const docRef = await addDoc(
collection(db,"orders"),
orderData
);

loader.style.display = "none";

success.style.display = "block";

return docRef.id;

}catch(error){

console.error(error);

loader.style.display = "none";

alert("Failed to save order");

return null;

}

}



window.payNow = async function(){

const orderId = await saveOrder("PayPal");

if(!orderId){

return;

}


const paypalUrl =
"https://www.paypal.com/ncp/payment/2QBAVWTMDFPFW";


window.location.href = paypalUrl;

}



window.orderWhatsapp = async function(){

const orderId = await saveOrder("WhatsApp");

if(!orderId){

return;

}


const name = document.getElementById("name").value.trim();

const phone = document.getElementById("phone").value.trim();

const address = document.getElementById("address").value.trim();


const message =
`*NEW ORDER*%0A%0A` +
`Order ID: ${orderId}%0A` +
`Name: ${name}%0A` +
`Phone: ${phone}%0A` +
`Address: ${address}%0A` +
`Total: R499`;


window.open(
`https://wa.me/27600000000?text=${message}`,
"_blank"
);

}

</script>

</body>
</html>
