<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>THUBALESHA Fragrance</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:linear-gradient(
135deg,
#fffaf5,
#e6d3a3,
#fffaf5
);
min-height:100vh;
}

/* HEADER */

header{
background:#000;
color:#fff;
padding:15px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

header h1{
font-size:28px;
letter-spacing:2px;
}

header button{
margin-top:10px;
padding:12px 18px;
background:#d4af37;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

/* SEARCH */

#searchBar{
width:90%;
max-width:400px;
display:block;
margin:20px auto;
padding:14px;
border-radius:12px;
border:1px solid #ccc;
outline:none;
font-size:16px;
}

/* PRODUCTS */

#perfumeList{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#fff;
padding:15px;
border-radius:18px;
box-shadow:0 8px 18px
rgba(0,0,0,0.15);
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.popular{
background:#d4af37;
padding:4px 10px;
border-radius:8px;
display:inline-block;
font-size:12px;
margin-bottom:8px;
font-weight:bold;
}

.card h3{
margin:10px 0;
}

.card p{
font-size:22px;
font-weight:bold;
color:#d4af37;
margin:10px 0;
}

.card button{
width:100%;
padding:12px;
background:#000;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* CART */

#cartPanel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:400px;
height:100%;
background:#fff;
padding:20px;
overflow:auto;
z-index:9999;
transition:0.4s;
box-shadow:-5px 0 20px rgba(0,0,0,0.2);
}

#cartPanel.active{
right:0;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;
}

.qty button{
padding:5px 10px;
border:none;
background:#000;
color:#fff;
border-radius:6px;
cursor:pointer;
margin:0 2px;
}

.pay-btn{
display:block;
width:100%;
padding:14px;
margin-top:12px;
background:#000;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

.pay-btn:hover{
opacity:0.9;
}

input,select{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ccc;
outline:none;
font-size:15px;
}

#checkout{
margin-top:15px;
}

/* WHATSAPP */

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:#fff;
padding:14px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* FOOTER */

footer{
background:#000;
color:#fff;
text-align:center;
padding:20px;
margin-top:30px;
}

</style>
</head>

<body>

<header>

<h1>THUBALESHA Fragrance</h1>

<button onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</header>

<input
type="text"
id="searchBar"
placeholder="Search perfume..."
onkeyup="searchPerfume()"
/>

<div id="perfumeList"></div>

<!-- CART -->

<div id="cartPanel">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<h3 style="margin-top:15px;">
Total: R<span id="totalPrice">0</span>
</h3>

<div id="checkout">

<input id="name"
type="text"
placeholder="Full Name">

<input id="phone"
type="tel"
placeholder="Phone Number">

<input id="address"
type="text"
placeholder="Delivery Address">

<select id="delivery">
<option value="60">
Local Delivery R60
</option>

<option value="120">
Nationwide Delivery R120
</option>
</select>

<button class="pay-btn"
onclick="payNow()">
💳 Pay With Yoco
</button>

<button class="pay-btn"
onclick="closeCart()">
Close
</button>

<a
id="whatsappOrder"
class="pay-btn"
style="
text-decoration:none;
text-align:center;
background:#25D366;
"
target="_blank">
Order Via WhatsApp
</a>

</div>

</div>

<a
href="https://wa.me/27656911520"
class="whatsapp"
target="_blank">
WhatsApp
</a>

<footer>
© 2026 THUBALESHA Fragrance
</footer>

<script>

/* PRODUCTS */

const perfumes = [

{name:"Dior Sauvage",popular:true},
{name:"Bleu de Chanel",popular:true},
{name:"Creed Aventus",popular:true},
{name:"Black Opium",popular:true},
{name:"Good Girl",popular:true},
{name:"One Million",popular:true},
{name:"Versace Eros",popular:true},
{name:"YSL Libre",popular:true},
{name:"La Vie Est Belle",popular:true},
{name:"Armani Code",popular:true},

{name:"Chanel No.5"},
{name:"Lady Million"},
{name:"Red Door"},
{name:"Coppelia"},
{name:"Avroy Chalet"},
{name:"Paco Invictus"},
{name:"Tom Ford Oud Wood"},
{name:"Dunhill Red"},
{name:"Dunhill Black"},
{name:"Ted Lapidus"},
{name:"Aramis 900"},
{name:"Belagari"},
{name:"Hordelsol"},
{name:"Sheriff"},
{name:"OPRHE"},
{name:"PAN"},
{name:"ANG"},
{name:"DHL"},
{name:"Tza"},
{name:"Gucci Bloom"},
{name:"Burberry Her"},
{name:"CK One"},
{name:"CK Be"},
{name:"Issey Miyake"},
{name:"Davidoff Cool Water"},
{name:"Bvlgari Man"},
{name:"Jaguar Classic"},
{name:"Lacoste White"},
{name:"Hugo Boss"},
{name:"Boss Bottled"},
{name:"212 VIP"},
{name:"212 Sexy"},
{name:"Mont Blanc Legend"},
{name:"Mont Blanc Explorer"},
{name:"Diesel Only The Brave"},
{name:"Azzaro Wanted"},
{name:"Azzaro Chrome"},
{name:"Nautica Voyage"},
{name:"YSL Y"},
{name:"Armani Si"},
{name:"Givenchy Gentleman"},
{name:"Givenchy Irresistible"},
{name:"Joop Homme"},
{name:"Polo Blue"},
{name:"Polo Red"},
{name:"Polo Black"}

];
let cart = [];

/* LOAD PRODUCTS */

function loadPerfumes(list){

const container =
document.getElementById("perfumeList");

container.innerHTML = "";

list.forEach(p=>{

container.innerHTML += `

<div class="card">

${p.popular
? '<div class="popular">🔥 Popular</div>'
: ''}

<h3>${p.name}</h3>

<p>R230</p>

<button onclick="addToCart('${p.name}')">
Add To Cart
</button>

</div>

`;

});

}

/* ADD TO CART */

function addToCart(name){

const item =
cart.find(p=>p.name===name);

if(item){

item.qty++;

}else{

cart.push({
name:name,
qty:1
});

}

updateCart();
openCart();

}

/* UPDATE CART */

function updateCart(){

const cartItems =
document.getElementById("cartItems");

cartItems.innerHTML = "";

let subtotal = 0;

cart.forEach((item,index)=>{

subtotal += item.qty * 230;

cartItems.innerHTML += `

<div class="cart-item">

<div>
<b>${item.name}</b><br>
Qty: ${item.qty}
</div>

<div class="qty">

<button onclick="changeQty(${index},-1)">
-
</button>

<button onclick="changeQty(${index},1)">
+
</button>

</div>

</div>

`;

});

const delivery =
parseInt(
document.getElementById("delivery").value
);

const total = subtotal + delivery;

document.getElementById("totalPrice")
.innerText = total;

document.getElementById("cartCount")
.innerText =
cart.reduce((sum,item)=>sum+item.qty,0);

/* WHATSAPP */

const orderText = cart.map(
item =>
`${item.name} x${item.qty}`
).join(", ");

document.getElementById(
"whatsappOrder"
).href =

`https://wa.me/27656911520?text=
Hello THUBALESHA,
I want to order:
${orderText}
Total:R${total}`;

}

/* CHANGE QTY */

function changeQty(index,change){

cart[index].qty += change;

if(cart[index].qty <= 0){

cart.splice(index,1);

}

updateCart();

}

/* SEARCH */

function searchPerfume(){

const value =
document.getElementById("searchBar")
.value
.toLowerCase();

const filtered =
perfumes.filter(p=>
p.name.toLowerCase().includes(value)
);

loadPerfumes(filtered);

}

/* CART OPEN */

function openCart(){

document.getElementById("cartPanel")
.classList.add("active");

}

/* CART CLOSE */

function closeCart(){

document.getElementById("cartPanel")
.classList.remove("active");

}

/* YOCO PAYMENT */

async function payNow(){

if(cart.length === 0){

alert("Cart is empty");

return;

}

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

const address =
document.getElementById("address").value;

if(!name || !phone || !address){

alert("Please fill all fields");

return;

}

let subtotal = 0;

cart.forEach(item=>{

subtotal += item.qty * 230;

});

const delivery =
parseInt(
document.getElementById("delivery").value
);

const total = subtotal + delivery;

try{

const response = await fetch(

"https://us-central1-payment-2d274.cloudfunctions.net/createCheckout",

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
amount:total
})

}

);

const data =
await response.json();

if(data.redirectUrl){

window.location.href =
data.redirectUrl;

}else{

alert("Payment link error");

}

}catch(error){

console.log(error);

alert("Payment failed");

}

}

/* INITIAL LOAD */

loadPerfumes(perfumes);
updateCart();

</script>

</body>
</html>
